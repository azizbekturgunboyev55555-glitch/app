<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Testlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#10151c;--card:#1b2430;--tx:#eef2f7;--hint:#8795a6;--bt:#4f7cff;--ok:#2ea66b;--warn:#f5a524;--fs:17px}
.light{--bg:#f3f5f9;--card:#fff;--tx:#111827;--hint:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.45 system-ui,sans-serif;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:6px 0 4px}.hint{color:var(--hint);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.item:active,.opt:active,.btn:active{transform:scale(.98)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.chip{background:var(--card);border-radius:20px;padding:8px 14px;white-space:nowrap;border:2px solid transparent;font-size:14px}
.chip.on{border-color:var(--bt)}
.daily{background:var(--bt);color:#fff;cursor:pointer}
.opt{background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;border:2px solid transparent;cursor:pointer;transition:.12s}
.opt.sel{border-color:var(--bt);background:rgba(79,124,255,.15)}
input.oi{width:100%;background:var(--card);color:var(--tx);border:2px solid var(--bt);border-radius:14px;padding:14px;font-size:18px}
.btn{background:var(--bt);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;width:100%;transition:.12s}
.btn.sec{background:var(--card);color:var(--tx)}
.top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 0;z-index:5}
.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.red{color:#ef4444}
.bot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);display:flex;gap:8px}
.sheet{position:fixed;inset:0;background:var(--bg);padding:16px;overflow:auto;z-index:9}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cell{background:var(--card);border-radius:12px;padding:12px 0;text-align:center;font-weight:600}
.cell.done{background:var(--bt);color:#fff}.cell.flag{outline:3px solid var(--warn)}.cell.cur{border:2px solid var(--tx)}
.sk{height:60px;border-radius:14px;background:var(--card);margin-bottom:10px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.4}}
.small{padding:8px 12px;width:auto;font-size:14px}

.hero{background:linear-gradient(135deg,#3b5bdb,#4f7cff);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.hero b{font-size:19px}.hero small{opacity:.85;display:block;margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sc{background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;font-size:13px;border:2px solid transparent}
.sc.on{border-color:var(--bt);background:rgba(79,124,255,.18)}.sc i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{background:var(--card);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.tc em{font-style:normal;background:rgba(79,124,255,.2);color:var(--bt);border-radius:8px;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tc b{font-size:14px;display:block}.tc span{font-size:12px;color:var(--hint)}
.fl{display:flex;gap:8px;overflow-x:auto;margin:14px 0 10px}
</style></head><body>
<div id="app"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<script>
const tg=window.Telegram?.WebApp||{ready(){},expand(){},initDataUnsafe:{},themeParams:{}};
tg.ready();tg.expand();
const $=document.getElementById('app');const LS=localStorage;
let DB,SUB=0,run=null,timer=null;
const user=tg.initDataUnsafe?.user||{};
if(LS.theme==='light')document.body.classList.add('light');
if(LS.fs)document.documentElement.style.setProperty('--fs',LS.fs+'px');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const math=()=>{if(window.renderMathInElement)renderMathInElement($,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})};
const tests=()=>DB.subjects.flatMap(s=>s.tests.map(t=>({...t,subj:s.name})));

fetch('questions.json?'+Date.now()).then(r=>r.json()).then(d=>{DB=d;
 const saved=JSON.parse(LS.sess||'null');
 if(saved&&Date.now()<saved.end){run=saved;view()}
 else if(new URLSearchParams(location.search).get('daily'))daily();else home()})
 .catch(()=>$.innerHTML='<h1>Yuklanmadi</h1><div class="hint">Internetni tekshirib, qayta oching.</div>');

function home(){
 clearInterval(timer);run=null;
 const s=DB.subjects[SUB],all=tests().length,st=+LS.streak||0;
 $.innerHTML=`<div class="hero"><div><b>Salom, ${esc(user.first_name||"do'st")}!</b><small>${DB.subjects.map(x=>x.name).join(' · ')} · ${all} ta test</small></div><div style="font-size:28px">🎓</div></div>
 <div class="hero daily" style="background:linear-gradient(135deg,#4f7cff,#6b8cff);cursor:pointer" onclick="daily()"><div><b>📅 Kunlik 5 savol</b><small>3 daqiqalik mashq · seriyani uzmang</small></div><div style="background:rgba(255,255,255,.2);border-radius:12px;padding:6px 12px;font-weight:700">🔥 ${st}</div></div>
 <div class="sg">${DB.subjects.map((x,i)=>`<div class="sc ${i==SUB?'on':''}" onclick="SUB=${i};home()"><i>${x.ic}</i><b>${x.name}</b><div class="hint">${x.tests.length} ta test</div></div>`).join('')}</div>
 <div class="fl"><span class="chip on">Hammasi · ${s.tests.length}</span></div>
 ${s.tests.length?`<div class="tg">${s.tests.map((t,i)=>`<div class="tc" onclick="intro('${t.id}')"><em>${i+1}</em><div><b>${t.t}</b><span>${t.qs.length} savol · ${t.min} daq</span></div></div>`).join('')}</div>`:'<div class="hint">Bu fanga hali test qo\'shilmagan.</div>'}
 <div style="display:flex;gap:8px;margin-top:16px"><button class="btn sec small" onclick="LS.theme=LS.theme===\'light\'?\'\':\'light\';document.body.classList.toggle(\'light\')">🌓 Rejim</button>
 <button class="btn sec small" onclick="fs(1)">A+</button><button class="btn sec small" onclick="fs(-1)">A−</button></div>`}
function fs(d){const v=Math.max(14,Math.min(24,(+LS.fs||17)+d));LS.fs=v;document.documentElement.style.setProperty('--fs',v+'px')}

function intro(id){const t=tests().find(x=>x.id==id);
 $.innerHTML=`<h1>${t.t}</h1><div class="card">${t.subj}<br>${t.qs.length} ta savol · ${t.min} daqiqa<div class="hint" style="margin-top:8px">Vaqt boshlanganda ketadi. Sahifani yopsangiz ham to'xtamaydi.</div></div>
 <button class="btn" onclick="begin('${id}')">Boshlash</button><button class="btn sec" style="margin-top:8px" onclick="home()">Orqaga</button>`}
function begin(id){const t=tests().find(x=>x.id==id);
 run={id,title:t.t,qs:t.qs,ans:t.qs.map(()=>''),flags:t.qs.map(()=>0),i:0,start:Date.now(),end:Date.now()+t.min*60000};save();view()}
function daily(){
 const all=DB.subjects.flatMap(s=>s.tests.flatMap(t=>t.qs.map((q,i)=>({q,ref:t.id+':'+i}))));
 const pick=all.sort(()=>Math.random()-.5).slice(0,5);
 if(!pick.length){home();return}
 run={id:'daily',title:'Kunlik 5 savol',qs:pick.map(p=>p.q),ids:pick.map(p=>p.ref),ans:pick.map(()=>''),flags:pick.map(()=>0),i:0,start:Date.now(),end:Date.now()+300000};save();view()}
const save=()=>LS.sess=JSON.stringify(run);

function view(){
 clearInterval(timer);
 const q=run.qs[run.i],a=run.ans[run.i],n=run.qs.length;
 const done=run.ans.filter(x=>x!=='').length;
 $.innerHTML=`<div class="top"><span class="tm" id="tm"></span><span class="hint">${run.i+1}/${n}</span><button class="btn sec small" onclick="fin()">Yakunlash</button></div>
 <div class="card" style="font-size:1.05em">${q.img?`<img src="${q.img}" style="max-width:100%">`:''}${esc(q.q)}</div>
 ${q.type==='y1'?q.o.map((o,k)=>`<div class="opt ${a===String(k)?'sel':''}" onclick="ans('${k}')"><b>${'ABCD'[k]}.</b> ${esc(o)}</div>`).join('')
  :`<input class="oi" id="oi" inputmode="decimal" placeholder="Javobni yozing" value="${esc(a)}" oninput="run.ans[run.i]=this.value;save()">`}
 <div class="bot"><button class="btn sec small" onclick="go(-1)">←</button>
 <button class="btn sec small" onclick="flag()">${run.flags[run.i]?'⭐':'☆'}</button>
 <button class="btn sec" onclick="sheet()">Javob varaqasi ${done}/${n}</button>
 <button class="btn small" onclick="go(1)">→</button></div>`;
 math();tick();timer=setInterval(tick,1000)}
function tick(){const s=Math.max(0,Math.floor((run.end-Date.now())/1000));const el=document.getElementById('tm');
 if(el){el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('red',s<60)}
 if(s<=0){clearInterval(timer);send()}}
function ans(k){run.ans[run.i]=run.ans[run.i]===k?'':k;save();view()}
function go(d){run.i=Math.max(0,Math.min(run.qs.length-1,run.i+d));save();view()}
function flag(){run.flags[run.i]^=1;save();view()}
function sheet(){const d=document.createElement('div');d.className='sheet';d.id='sh';
 d.innerHTML=`<h1>Javob varaqasi</h1><div class="hint">Rangli — javob berilgan, ⭐ — belgilangan</div><div class="grid">${run.qs.map((_,i)=>`<div class="cell ${run.ans[i]!==''?'done':''} ${run.flags[i]?'flag':''} ${i==run.i?'cur':''}" onclick="run.i=${i};save();document.getElementById('sh').remove();view()">${i+1}</div>`).join('')}</div>
 <button class="btn" onclick="document.getElementById('sh').remove()">Davom etish</button>`;document.body.appendChild(d)}
function fin(){const e=run.ans.filter(x=>x==='').length;
 const m=e?`${e} ta savolga javob bermadingiz. Yakunlaymizmi?`:'Testni yakunlaymizmi?';
 tg.showConfirm?tg.showConfirm(m,ok=>ok&&send()):(confirm(m)&&send())}
function send(){
 clearInterval(timer);
 const p={t:run.id,a:run.ans,s:Math.round((Date.now()-run.start)/1000)};if(run.ids)p.ids=run.ids;
 LS.removeItem('sess');
 if(run.id==='daily'){const d=new Date().toISOString().slice(0,10),y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(LS.dday!==d){LS.streak=(LS.dday===y?(+LS.streak||0):0)+1;LS.dday=d}}
 if(!tg.initData){$.innerHTML='<h1>Natija yuborilmadi</h1><div class="hint">Mini App\'ni botdagi «📝 Testlar» tugmasi orqali oching.</div>';return}
 $.innerHTML='<h1>Yuborilmoqda…</h1>';
 try{tg.sendData(JSON.stringify(p))}catch(e){$.innerHTML='<h1>Xatolik</h1><div class="hint">Botdagi «📝 Testlar» tugmasi orqali oching.</div>'}}
</script></body></html>
